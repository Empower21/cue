[package]
name = "cue"
version = "0.1.0"
description = "AI co-pilot desktop overlay"
edition = "2021"
rust-version = "1.78"

[lib]
name = "cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# Audio capture
cpal = "0.15"
webrtc-vad = "0.4"
rubato = "0.15"

# Async + sync primitives
async-trait = "0.1"
futures-util = "0.3"
parking_lot = "0.12"

# WebSocket + HTTP streaming
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Serialization
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Other
bytes = "1.7"
url = "2.5"
dirs = "5.0"

# Document import (Context tab → voice sample upload)
zip = { version = "2.2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"

# Screenshot capture for vision-mode answers
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# NSWindow the *class* is gated behind the "NSResponder" feature in
# objc2-app-kit 0.2.x because NSWindow : NSResponder. The "NSWindow"
# feature only enables non-class helpers (NSWindowCollectionBehavior,
# NSWindowSharingType, etc.). Need both to use `setCollectionBehavior`
# on an &NSWindow.
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder"] }
objc2-foundation = "0.2"
# Audio capture additions (Step 3.1 — P2-T3):
# screencapturekit 0.3 does not exist; latest is 2.0.0 — pinned here.
# coreaudio-rs plan asked for 0.12; latest is 0.14.2 — pinned here.
# core-foundation 0.10 matches plan exactly.
core-foundation = "0.10"
coreaudio-rs = "0.14"
screencapturekit = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
